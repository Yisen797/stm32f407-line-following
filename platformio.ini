; STM32F407ZGT6 PlatformIO 工程配置文件
; 板卡: 黑色沉金核心板 LXB407ZG-P1 (black_f407zg)

[env:black_f407zg]

; ---- 平台和框架 ----
platform = ststm32            ; STM32 平台
board = black_f407zg          ; 黑色 F407ZG 板
framework = stm32cube         ; STM32Cube HAL 框架

; ---- 烧录和调试 ----
upload_protocol = stlink      ; 声明使用 ST-Link
debug_tool = stlink
monitor_speed = 115200

; 注意: PlatformIO 内置的 OpenOCD 与本板的 ST-Link 克隆版 (V2J37S7)
; 不兼容。烧录请使用 ST-LINK Utility CLI:
;   ST-LINK_CLI.exe -c SWD UR -ME -P firmware.bin 0x08000000 -V -Rst
; 其中 UR = Connect Under Reset (必须接 NRST 线)

; ---- 编译宏定义 ----
; 这些宏会传给编译器，用于 HAL 框架的模块选择和芯片配置
build_flags =
    -D HSE_VALUE=8000000       ; 外部晶振 8MHz
    -D STM32F407xx             ; 芯片型号
    -D USE_HAL_DRIVER          ; 使用 HAL 驱动
    -D HAL_I2C_MODULE_ENABLED  ; 启用 I2C 模块 (OLED)
    -D HAL_GPIO_MODULE_ENABLED ; 启用 GPIO 模块 (LED + 传感器)
    -D HAL_RCC_MODULE_ENABLED  ; 启用时钟模块
    -D HAL_CORTEX_MODULE_ENABLED
    -D HAL_DMA_MODULE_ENABLED
    -D HAL_FLASH_MODULE_ENABLED
    -D HAL_PWR_MODULE_ENABLED
